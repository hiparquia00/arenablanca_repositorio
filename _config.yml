##########
# collectionbuilder-gh
# Jekyll Digital Collection Generator, designed for GitHub Pages
# https://github.com/CollectionBuilder/collectionbuilder-gh
##########

##########
# URL VARIABLES [optional if using GitHub Pages!]
#
# url is site domain, full URL to the production location of your collection
# on GitHub Pages follows the pattern username.github.io
#url: https://collectionbuilder.github.io 
# baseurl is path to location on the domain if necessary e.g. /digital/hjccc
# on GitHub Pages it is your github repository's name prefixed with a /
#baseurl: /collectionbuilder-gh 
# location of code, the full url to your github repository
source-code: https://github.com/CollectionBuilder/collectionbuilder-gh

##########
# SITE SETTINGS
#
# title of site appears in banner
title: Minería de Arena
# tagline, a short phrase that will appear throughout the site in the top banner
tagline: Repositorio Institucional
# description appears in meta tags and other locations
# this description might appear in search result lists, keep around 160 characters max
description: "Este repositorio reúne y organiza bibliografía y otros recursos relacionados con la minería y extracción de arena en distintos contextos geográficos y ambientales. Su colección aborda particularmente la extracción minera de arena en bosques sobre arena blanca de la Amazonía, así como en ríos, playas y desiertos, e incorpora investigaciones provenientes de distintos continentes, incluyendo América del Sur, Asia, África y Europa. El repositorio busca facilitar el acceso, consulta y difusión de información sobre esta actividad, sus características, impactos y las dinámicas socioambientales asociadas. El repositorio tiene además una vocación colaborativa y se encuentra en proceso de crecimiento. Actualmente reúne principalmente documentos en formato PDF, pero se espera incorporar progresivamente fotografías, videos, mapas y otros materiales que contribuyan a documentar y comprender la extracción de arena. Invitamos a investigadores, estudiantes, organizaciones y personas interesadas a compartir bibliografía y recursos que puedan enriquecer la colección. Este repositorio nace en el marco del proyecto “Manejo de Agua, Bosques y Arena en la Amazonía - Seguridad para el Ecosistema y Salud Humana”, desarrollado en colaboración con la Interamerican Network of Academies of Sciences (IANAS), la Pontificia Universidad Católica del Perú (PUCP), la Universidad Nacional de la Amazonía Peruana (UNAP) y la Universidad Nacional Agraria La Molina (UNALM).
"
# creator of the digital collection, to appear in meta tags; we typically use our GitHub usernames but feel free to just use your name
author: Fátima Luchini

##########
# COLLECTION SETTINGS
#
# Set the metadata for your collection (the name of the csv file in your _data directory that describes the objects in your collection) 
# Use the filename of your CSV **without** the ".csv" extension! E.g. _data/demo-metadata.csv --> "demo-metadata"
metadata: repo_arena_metadata

##########
# Site/Organization Branding 
#   Uncomment these and enter information for your organization (replacing the CDIL links and name below) if you'd like to brand your site with a logo
#
organization-name: "Pontificia Universidad Católica del Perú (PUCP) - Red Interamericana de Academias de Ciencias (IANAS)"
organization-link: https://www.pucp.edu.pe/
organization-logo-banner: assets/img/ianaspucp.png
organization-logo-nav: assets/img/ianaspucpnav.png

##########
# ROBOTS EXCLUDE
#
# set noindex to true if you do NOT want Google to index your site
# noindex: true 

##########
# BUILD SETTINGS 
#
# Note: use environment variable on build command to include analytics
# JEKYLL_ENV=production jekyll build
# (this is done automatically by gh-pages build)
#
# ignore stuff
exclude: [docs/, Rakefile, README.md, LICENSE, CITATION.cff, CODE_OF_CONDUCT.md, CONTRIBUTING.md]
# compress CSS output
sass:
  style: compressed
